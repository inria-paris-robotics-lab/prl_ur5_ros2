    enable_depth: true
    enable_ir: false
    color_fps: 15
    depth_fps: 15
    ir_fps: 15
    enable_point_cloud: true
    
    enable_colored_point_cloud: true
    depth_registration: true
    enable_frame_sync: true
    
    # --- SYNCHRONISATION ---
    depth_delay_us: 160
    color_delay_us: 0
    trigger2image_delay_us: 0
    trigger_out_delay_us: 0
    trigger_out_enabled: false
    time_domain: "system"
    
    # --- NOISE FILTERING ---
    enable_decimation_filter: false
    enable_spatial_filter: true
    spatial_filter_alpha: 0.5
    spatial_filter_magnitude: 2
    spatial_filter_radius: 2
    enable_temporal_filter: true
    temporal_filter_weight: 0.4
    temporal_filter_diff_threshold: 20
    enable_hole_filling_filter: true
