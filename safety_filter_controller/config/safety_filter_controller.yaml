safety_filter_controller:
  ros__parameters:
    type: safety_filter_controller/SafetyFilterController  # <--- INDISPENSABLE pour que le controller_manager le trouve
    joints:
      active_joint: 
        - right_shoulder_pan_joint
        - right_shoulder_lift_joint
        - right_elbow_joint
        - right_wrist_1_joint
        - right_wrist_2_joint
        - right_wrist_3_joint
      passive_joint:
        - left_shoulder_pan_joint
        - left_shoulder_lift_joint
        - left_elbow_joint
        - left_wrist_1_joint
        - left_wrist_2_joint
        - left_wrist_3_joint
    max_delta_per_joint: [0.05, 0.05, 0.05, 0.05, 0.05, 0.05]
    horizon_steps: 5
    control_period_estimate: 0.008